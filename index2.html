<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Virtual</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="contenedor-campus">
        <div class="cont-mitad-azul"></div>
            <img src="https://www.campusvirtual.com.gt/images/app_promotion_v2.gif" class="logo-phone">
            <div class="logos-playstore">
                <img src="https://www.campusvirtual.com.gt/images/App%20Badges/GetItOnGooglePlay_Badge_Web_color_Spanish.png" alt="">
            </div>
            <div class="logo-appstore">
                <img src="https://www.campusvirtual.com.gt/images/App%20Badges/Download_on_the_App_Store_Badge_ES_RGB_blk_100217.svg" alt="">
            </div>
            <div class="logo-appgallery">
                <img src="https://www.campusvirtual.com.gt/images/App%20Badges/ExploreItOnAppGallery_Badge_Black_Spanish.png" alt="">
            </div>
            </div>

            <div class="cont-logo-campus">
            <img src="https://www.campusvirtual.com.gt/images/Logo.png"  class="logo-campus">
            </div>
 
        <img src="https://www.campusvirtual.com.gt/images/Logotipo-Blanco-App.ico"  class="logo-blanco">
    
        <div class="cont-login">
            <input type="text" placeholder="Usuario" class="input-correo">
        </div>
        <div class="cont-pass">
            <input type="text" placeholder="Contraseña" class="input-contraseña">
        </div>
        <div class="boton-ingresar">
            <button>Ingresar</button>
        </div>
    </div>

</html>
